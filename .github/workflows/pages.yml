# Builds the project website (site/, rendered by site/build.sh) and deploys it
# to GitHub Pages at livingscroll.net. The privacy policy pages are rendered
# from site/legal/*.md — the same files the app bundles — so the website and
# the app never diverge.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions"; Custom
# domain: livingscroll.net (see TASKS/Publish_04 / docs/CI_SETUP.md).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Assets/icon-hires.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Lets release.yml rebuild the site after publishing a release.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: site/build.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
